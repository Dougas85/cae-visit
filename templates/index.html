<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Visita Operacional</title>
    <!-- CSS Bootstrap para estilização básica -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- html2pdf.js para exportação do PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* Estilos específicos do modelo do PDF */
        #pdf-template {
            display: none; /* Fica oculto na tela do usuário */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #1e293b;
            padding: 20px;
            background-color: #ffffff;
        }
        .pdf-header {
            background-color: #004080;
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .pdf-table td {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            font-size: 11pt;
        }
        .pdf-label {
            font-weight: bold;
            background-color: #f1f5f9;
            width: 25%;
        }
        .pdf-section {
            font-size: 12pt;
            font-weight: bold;
            color: #004080;
            border-left: 4px solid #004080;
            padding-left: 8px;
            margin: 15px 0 10px 0;
        }
        .pdf-box {
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 6px;
            background-color: #f8fafc;
            margin-bottom: 15px;
            font-size: 10.5pt;
        }
        .badge-sim { color: #15803d; font-weight: bold; }
        .badge-nao { color: #b91c1c; font-weight: bold; }
    </style>
</head>
<body class="bg-light p-3 p-md-5">

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
    <h3 class="mb-4 text-primary">Registrar Visita Operacional</h3>
    
    <form id="formVisita">
        <div class="mb-3">
            <label class="form-label">Coordenador:</label>
            <input type="text" id="coordenador" name="coordenador" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nome da Unidade:</label>
            <input type="text" id="unidade" name="unidade" class="form-control" placeholder="Ex: CDD Presidente Prudente" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Foto da Visita:</label>
            <input type="file" id="foto" name="foto" accept="image/*" class="form-control" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" id="unidade_organizada" name="unidade_organizada" class="form-check-input">
            <label class="form-check-label">Unidade Organizada</label>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" id="unidade_limpa" name="unidade_limpa" class="form-check-input">
            <label class="form-check-label">Unidade Limpa</label>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" id="efetivo_previsto" name="efetivo_previsto" class="form-check-input">
            <label class="form-check-label">Efetivo Conforme Previsto</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Resumo e Observações:</label>
            <textarea id="resumo" name="resumo" class="form-control" rows="3" required></textarea>
        </div>

        <!-- Campos Ocultos para Localização -->
        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">
        <input type="hidden" id="localizacao_nome" name="localizacao_nome">

        <button type="submit" id="btnEnviar" class="btn btn-primary w-100">Concluir e Enviar Relatório</button>
    </form>
</div>

<!-- TEMPLATE OCULTO PARA A GERAÇÃO DO PDF -->
<div id="pdf-template">
    <div class="pdf-header">
        <h2 style="margin:0;">Relatório de Visita Operacional</h2>
        <p style="margin:0; opacity:0.8; font-size:10pt;">Acompanhamento de Unidades</p>
    </div>

    <table class="pdf-table">
        <tr>
            <td class="pdf-label">Coordenador:</td>
            <td id="pdf-coordenador"></td>
            <td class="pdf-label">Data/Hora:</td>
            <td id="pdf-data"></td>
        </tr>
        <tr>
            <td class="pdf-label">Unidade:</td>
            <td id="pdf-unidade"></td>
            <td class="pdf-label">Localização:</td>
            <td id="pdf-localizacao"></td>
        </tr>
    </table>

    <div class="pdf-section">Checklist de Conformidade</div>
    <div class="pdf-box">
        <div>Organização: <span id="pdf-org"></span></div>
        <div>Limpeza: <span id="pdf-limp"></span></div>
        <div>Efetivo Previsto: <span id="pdf-efe"></span></div>
    </div>

    <div class="pdf-section">Resumo da Visita</div>
    <div class="pdf-box" id="pdf-resumo-texto"></div>

    <div class="pdf-section">Evidência Fotográfica</div>
    <div style="text-align:center; margin-top:10px;">
        <img id="pdf-img-preview" style="max-width: 100%; max-height: 300px; border-radius: 6px; border: 1px solid #cbd5e1;">
    </div>
</div>

<script>
    // Captura inicial da localização
    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                document.getElementById('latitude').value = position.coords.latitude;
                document.getElementById('longitude').value = position.coords.longitude;
            });
        }
    };

    // Geocodificação Reversa (Converte Lat/Lon em Nome da Cidade/Bairro)
    async function obterNomeLocalizacao(lat, lon) {
        if (!lat || !lon) return "Localização não registrada";
        try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await resp.json();
            const cidade = data.address.city || data.address.town || data.address.municipality || 'Cidade não identificada';
            const bairro = data.address.suburb || data.address.neighbourhood || '';
            const uf = data.address.state ? ` - ${data.address.state_district || ''}` : '';
            
            return bairro ? `${bairro}, ${cidade}` : cidade;
        } catch {
            return "Localização Indisponível";
        }
    }

    // Processo de envio e geração do PDF
    document.getElementById('formVisita').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "Processando e Gerando PDF...";

        const lat = document.getElementById('latitude').value;
        const lon = document.getElementById('longitude').value;

        // 1. Converte coordenadas para Endereço
        const localizacaoTexto = await obterNomeLocalizacao(lat, lon);
        document.getElementById('localizacao_nome').value = localizacaoTexto;

        // 2. Prepara o envio para o Flask/Supabase
        const formData = new FormData(e.target);

        try {
            const res = await fetch('/salvar', { method: 'POST', body: formData });
            const result = await res.json();

            if (res.ok) {
                // 3. Preenche o template oculto do PDF
                document.getElementById('pdf-coordenador').innerText = document.getElementById('coordenador').value;
                document.getElementById('pdf-unidade').innerText = document.getElementById('unidade').value;
                document.getElementById('pdf-localizacao').innerText = localizacaoTexto;
                document.getElementById('pdf-data').innerText = new Date().toLocaleString('pt-BR');
                document.getElementById('pdf-resumo-texto').innerText = document.getElementById('resumo').value;

                document.getElementById('pdf-org').innerHTML = document.getElementById('unidade_organizada').checked ? '<span class="badge-sim">SIM</span>' : '<span class="badge-nao">NÃO</span>';
                document.getElementById('pdf-limp').innerHTML = document.getElementById('unidade_limpa').checked ? '<span class="badge-sim">SIM</span>' : '<span class="badge-nao">NÃO</span>';
                document.getElementById('pdf-efe').innerHTML = document.getElementById('efetivo_previsto').checked ? '<span class="badge-sim">SIM</span>' : '<span class="badge-nao">NÃO</span>';

                // Carrega a foto no PDF
                const fileFoto = document.getElementById('foto').files[0];
                if (fileFoto) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById('pdf-img-preview').src = e.target.result;
                        gerarEBaixarPDF();
                    };
                    reader.readAsDataURL(fileFoto);
                } else {
                    gerarEBaixarPDF();
                }
            } else {
                alert("Erro ao salvar: " + result.mensagem);
                btn.disabled = false;
                btn.innerText = "Concluir e Enviar Relatório";
            }
        } catch (err) {
            alert("Erro na conexão com o servidor.");
            btn.disabled = false;
            btn.innerText = "Concluir e Enviar Relatório";
        }
    });

    function gerarEBaixarPDF() {
        const element = document.getElementById('pdf-template');
        element.style.display = 'block'; // Exibe temporariamente para renderização

        const nomeUnidade = document.getElementById('unidade').value.replace(/[^a-zA-Z0-9]/g, "_");
        const opt = {
            margin:       10,
            filename:     `Relatorio_Visita_${nomeUnidade}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.style.display = 'none'; // Oculta novamente
            alert("Relatório salvo no banco de dados e PDF gerado com sucesso!");
            window.location.reload();
        });
    }
</script>

</body>
</html>
