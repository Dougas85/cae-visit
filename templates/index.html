<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Operacional - Inspeção de Unidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="h-full antialiased text-slate-800">

    <div class="max-w-xl mx-auto min-h-screen flex flex-col justify-between p-4 sm:p-6" x-data="app()">

        <div>
            <!-- Header Corporativo -->
            <header class="bg-slate-900 text-white p-5 rounded-2xl shadow-xl mb-6 border-b-4 border-blue-600">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-blue-400">Sistema Qualidade & Operações</span>
                        <h1 class="text-xl font-bold tracking-tight">Relatório de Inspeção Técnica</h1>
                    </div>
                    <div class="h-10 w-10 bg-blue-600/20 rounded-xl flex items-center justify-center border border-blue-500/30">
                        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                </div>
            </header>

            <!-- Status do GPS -->
            <div :class="gpsActive ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-amber-50 border-amber-200 text-amber-800'" class="border rounded-xl p-3.5 mb-6 text-xs flex items-center justify-between transition-all shadow-sm">
                <div class="flex items-center space-x-2.5">
                    <span class="relative flex h-2.5 w-2.5">
                      <span :class="gpsActive ? 'bg-emerald-400' : 'bg-amber-400'" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                      <span :class="gpsActive ? 'bg-emerald-500' : 'bg-amber-500'" class="relative inline-flex rounded-full h-2.5 w-2.5"></span>
                    </span>
                    <span class="font-medium" x-text="gpsMessage"></span>
                </div>
                <span class="font-mono text-[10px] bg-white px-2 py-0.5 rounded border border-slate-200 font-semibold" x-text="gpsAccuracy"></span>
            </div>

            <!-- Form -->
            <form @submit.prevent="submitForm" class="space-y-6">

                <!-- Identificação -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Dados da Inspeção</h2>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Coordenador Responsável</label>
                        <input type="text" x-model="form.coordenador" required placeholder="Digite seu nome completo" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Código / ID da Unidade Auditada</label>
                        <input type="number" x-model="form.unidade_id" required placeholder="Ex: 101" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Clima Organizacional Percebido</label>
                        <select x-model="form.clima" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="">Selecione...</option>
                            <option value="Excelente">Excelente</option>
                            <option value="Bom">Bom</option>
                            <option value="Regular">Regular</option>
                            <option value="Crítico">Crítico</option>
                        </select>
                    </div>
                </div>

                <!-- Checklist de Perguntas -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Checklist de Conformidade Operacional</h2>

                    <template x-for="(label, key) in perguntas" :key="key">
                        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80 space-y-2">
                            <span class="text-xs font-medium text-slate-700 block" x-text="label"></span>
                            <div class="flex space-x-2">
                                <button type="button" @click="form.respostas[key] = 'Sim'" :class="form.respostas[key] === 'Sim' ? 'bg-emerald-600 text-white font-bold border-emerald-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'" class="flex-1 py-1.5 text-xs rounded-lg border transition-all">Sim</button>
                                <button type="button" @click="form.respostas[key] = 'Não'" :class="form.respostas[key] === 'Não' ? 'bg-rose-600 text-white font-bold border-rose-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'" class="flex-1 py-1.5 text-xs rounded-lg border transition-all">Não</button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Evidência Fotográfica em Tempo Real -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Registro Fotográfico</h2>

                    <div class="relative border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-blue-500 transition-colors bg-slate-50">
                        <input type="file" @change="handleImage" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">

                        <template x-if="!imagePreview">
                            <div class="space-y-1">
                                <svg class="mx-auto h-8 w-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span class="text-xs font-semibold text-blue-600 block">Tirar foto da unidade</span>
                                <span class="text-[10px] text-slate-400 block">Abertura direta do sensor da câmera</span>
                            </div>
                        </template>

                        <template x-if="imagePreview">
                            <div class="space-y-2">
                                <img :src="imagePreview" class="h-32 mx-auto rounded-lg object-cover border">
                                <span class="text-xs font-semibold text-emerald-600 block">Foto capturada com sucesso!</span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Botão Enviar -->
                <button type="submit" :disabled="!gpsActive || submitting" :class="(!gpsActive || submitting) ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 active:scale-[0.98] shadow-blue-600/25 shadow-lg'" class="w-full text-white font-semibold py-3.5 px-4 rounded-xl text-sm transition-all duration-150 flex justify-center items-center space-x-2">
                    <span x-show="!submitting">Concluir e Enviar Relatório</span>
                    <span x-show="submitting">Registrando no servidor...</span>
                </button>
            </form>
        </div>

        <footer class="text-center py-4 text-[11px] text-slate-400 font-medium">
            Monitoramento de Frota & Qualidade Operacional
        </footer>
    </div>

    <script>
        function app() {
            return {
                gpsActive: false,
                gpsMessage: 'Capturando posição via GPS...',
                gpsAccuracy: '--',
                submitting: false,
                imagePreview: null,
                form: {
                    coordenador: '',
                    unidade_id: '',
                    clima: '',
                    latitude: null,
                    longitude: null,
                    precisao: null,
                    foto_base64: null,
                    respostas: {
                        item_organizada: 'Sim',
                        item_limpa: 'Sim',
                        item_efetivo: 'Sim',
                        item_residuo_mesa: 'Não',
                        item_objetos_sem_inducao: 'Não',
                        item_sro_saida: 'Sim',
                        item_gestor_qualidade: 'Sim',
                        item_registros_normativos: 'Sim',
                        item_sd_pratica: 'Sim',
                        item_acompanhamento_processos: 'Sim'
                    }
                },
                perguntas: {
                    item_organizada: '1. A unidade está organizada?',
                    item_limpa: '2. A unidade está limpa?',
                    item_efetivo: '3. A unidade está com o efetivo previsto?',
                    item_residuo_mesa: '4. Há resíduo de mesa simples?',
                    item_objetos_sem_inducao: '5. Existem objetos sem indução?',
                    item_sro_saida: '6. O lado previsto para saída no SROWEB saiu para entrega?',
                    item_gestor_qualidade: '7. O gestor acompanha os resultados de qualidade?',
                    item_registros_normativos: '8. Registros nos sistemas conforme os normativos?',
                    item_sd_pratica: '9. O SD está implantado na prática como previsto?',
                    item_acompanhamento_processos: '10. Os gestores acompanham os processos internos?'
                },
                init() {
                    if ("geolocation" in navigator) {
                        navigator.geolocation.getCurrentPosition(
                            pos => {
                                this.form.latitude = pos.coords.latitude;
                                this.form.longitude = pos.coords.longitude;
                                this.form.precisao = pos.coords.accuracy;
                                this.gpsActive = true;
                                this.gpsMessage = 'Localização validada via GPS';
                                this.gpsAccuracy = `±${Math.round(pos.coords.accuracy)}m`;
                            },
                            err => {
                                this.gpsMessage = 'Ative a localização no seu celular para continuar';
                            },
                            { enableHighAccuracy: true, timeout: 15000 }
                        );
                    }
                },
                handleImage(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            this.imagePreview = event.target.result;
                            this.form.foto_base64 = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },
                async submitForm() {
                    this.submitting = true;
                    try {
                        const res = await fetch('/salvar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.form)
                        });
                        const data = await res.json();
                        if (res.ok) {
                            alert('Relatório registrado com sucesso!');
                            window.location.reload();
                        } else {
                            alert('Erro: ' + data.mensagem);
                        }
                    } catch (e) {
                        alert('Falha na conexão com o servidor.');
                    } finally {
                        this.submitting = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
